<svg viewBox="0 0 1000 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: building. Joinville, Brazil.">
<style>@font-face{font-family:"ECSans";src:url(data:font/woff;base64,) format("woff")}
@font-face{font-family:"ECSerif";src:url(data:font/woff;base64,) format("woff")}
:root{--bone:#ffffff;--muted:#8fd8ff;--dim:#6cc4f5;--rule:rgba(143,216,255,.30);--accent:#8fd8ff;--ghost:rgba(143,216,255,.16);--node:#000000}
.sans{font-family:"ECSans",Geist,system-ui,"Segoe UI",sans-serif}
.serif{font-family:"ECSerif","Playfair Display",Georgia,serif;font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pop{opacity:0;transform:scale(.6);animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.flow{stroke-dasharray:4 7;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){
 .rise,.fade,.draw,.bar,.pop,.flow,.breathe,.ping{animation:none}
 .rise,.fade,.pop{opacity:1;transform:none}.draw{stroke-dashoffset:0}.bar{transform:none}.ping{opacity:0}
}
</style>
<line class="draw" style="animation-delay:0.1s" x1="48" y1="24" x2="952" y2="24" stroke="var(--rule)" stroke-width="1"/><circle class="ping" cx="60" cy="64" r="5" stroke="var(--accent)" fill="none" style="transform-origin:60px 64px"/><circle class="breathe" cx="60" cy="64" r="4" fill="var(--accent)"/><text class="serif" x="82" y="62" font-size="13" fill="var(--accent)" letter-spacing="3" >STATUS — BUILDING</text><text class="sans" x="82" y="82" font-size="12" fill="var(--bone)" letter-spacing="1" >probably in an editor, probably running a model</text><text class="sans" x="952" y="66" font-size="16" fill="var(--muted)" text-anchor="end" >Joinville, BR  ·  © 2026</text>
</svg>
