<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status">
<style>@font-face{font-family:"ECSans";src:url(data:font/woff;base64,) format("woff")}
@font-face{font-family:"ECSerif";src:url(data:font/woff;base64,) format("woff")}
:root{--bone:#000000;--muted:#1e4f9c;--dim:#5d83bf;--rule:rgba(10,61,145,.30);--accent:#0a3d91;--ghost:rgba(10,61,145,.12);--node:#ffffff}
.sans{font-family:"ECSans",Geist,system-ui,"Segoe UI",sans-serif}
.serif{font-family:"ECSerif","Playfair Display",Georgia,serif;font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pop{opacity:0;transform:scale(.6);animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.flow{stroke-dasharray:4 7;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){
 .rise,.fade,.draw,.bar,.pop,.flow,.breathe,.ping{animation:none}
 .rise,.fade,.pop{opacity:1;transform:none}.draw{stroke-dashoffset:0}.bar{transform:none}.ping{opacity:0}
}
</style>
<g class="rise" style="animation-delay:0.1s;"><text class="sans" x="48" y="32" font-size="17" fill="var(--bone)" >AI Engineer based in Joinville, SC, Brazil.</text></g><g class="rise" style="animation-delay:0.22s;"><text class="sans" x="48" y="60" font-size="17" fill="var(--bone)" >building across the stack — Python APIs · React interfaces · PostgreSQL · automation.</text></g><g class="rise" style="animation-delay:0.33999999999999997s;"><text class="sans" x="48" y="88" font-size="16" fill="var(--bone)" >drawn to products where generative AI meets solid backend engineering and clean UX.</text></g><line class="fade" style="animation-delay:0.5s" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/><g class="rise" style="animation-delay:0.5s;"><text class="serif" x="48" y="148" font-size="12" fill="var(--muted)" letter-spacing="2.5" >FOCUS</text><text class="sans" x="154" y="148" font-size="16" fill="var(--bone)" >AI-integrated systems · Python backend · React frontend · workflow automation</text></g><g class="rise" style="animation-delay:0.65s;"><text class="serif" x="48" y="182" font-size="12" fill="var(--muted)" letter-spacing="2.5" >STATUS</text><text class="sans" x="154" y="182" font-size="16" fill="var(--bone)" >open to opportunities — remote · hybrid · on-site</text></g><g class="rise" style="animation-delay:0.8s;"><text class="serif" x="48" y="216" font-size="12" fill="var(--muted)" letter-spacing="2.5" >BASED</text><text class="sans" x="154" y="216" font-size="16" fill="var(--bone)" >Joinville, SC, Brazil</text></g>
</svg>
